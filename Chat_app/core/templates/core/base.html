{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat_app</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0095f6;
      --primary-hover: #1877f2;
      --secondary: #262626;
      --light-bg: #fafafa;
      --border-color: #dbdbdb;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
      --text-primary: #262626;
      --text-secondary: #737373;
      --accent: #ff3040;
    }
    
    * {
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-image: url("{% static 'images/bg.png' %}");
      color: var(--text-primary);
      padding-top: 70px;
      padding-bottom: 50px;
      line-height: 1.5;
    }

    
    /* Navbar Styling */
    .navbar {
      background: rgba(255, 255, 255, 0.95) !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: var(--shadow-sm);
      padding: 0.5rem 1rem;
      border-bottom: 1px solid var(--border-color);
    }
    
    .navbar-brand {
      font-weight: 700;
      color: var(--secondary) !important;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
      position: relative;
      padding-left: 0.5rem;
    }
    
    .navbar-brand:before {
      content: '';
      position: absolute;
      left: -3px;
      top: 5px;
      height: 70%;
      width: 4px;
      background: linear-gradient(to bottom, var(--primary), var(--accent));
      border-radius: 4px;
    }
    
    .navbar-nav {
      gap: 0.5rem;
    }
    
    .navbar .nav-link {
      color: var(--text-secondary) !important;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    
    .navbar .nav-link:hover {
      color: var(--text-primary) !important;
      background-color: rgba(0, 0, 0, 0.03);
    }
    
    .navbar .nav-link.active {
      color: var(--primary) !important;
      font-weight: 600;
    }
    
    /* Button Styling */
    .btn {
      font-weight: 600;
      border-radius: 8px;
      padding: 0.5rem 1.2rem;
      transition: all 0.2s ease;
    }
    
    .btn-primary {
      background-color: var(--primary);
      border-color: var(--primary);
    }
    
    .btn-primary:hover {
      background-color: var(--primary-hover);
      border-color: var(--primary-hover);
      transform: translateY(-1px);
    }
    
    button.nav-link.btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      padding: 0.5rem 1rem;
      font-weight: 500;
    }
    
    button.nav-link.btn:hover {
      color: var(--text-primary);
      background-color: rgba(0, 0, 0, 0.03);
      text-decoration: none;
    }
    
    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .navbar {
        padding: 0.5rem 1rem;
      }
      
      .navbar-brand {
        font-size: 1.3rem;
      }
      
      .navbar-nav {
        margin-top: 0.5rem;
        padding: 0.5rem 0;
        border-top: 1px solid var(--border-color);
      }
      
      body {
        padding-top: 60px;
      }
    }
    
    /* Gradient Background Effect */
    .bg-gradient {
      background: linear-gradient(135deg, rgba(0, 149, 246, 0.1) 0%, rgba(255, 48, 64, 0.1) 100%);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      pointer-events: none;
    }
    
    /* Content Container */
    .content-container {
      background-color: #fff;
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      margin-top: 1rem;
      padding: 1.5rem;
      border: 1px solid var(--border-color);
    }
    
    /* Animation for navbar on scroll */
    .navbar.scrolled {
      padding: 0.3rem 1rem;
    }
    
    /* Custom navbar toggler */
    .navbar-toggler {
      border: none;
      padding: 0.4rem 0.5rem;
      border-radius: 8px;
      background-color: rgba(0, 0, 0, 0.02);
    }
    
    .navbar-toggler:focus {
      box-shadow: none;
      outline: none;
    }
  </style>
</head>
<body>
  <!-- Background Gradient -->
  <div class="bg-gradient"></div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
      <a class="navbar-brand" href="{% url 'core:index' %}">Poly Talk</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav ms-auto">
          {% if request.user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" href="{% url 'core:profile' %}">
              <i class="bi bi-person me-1"></i> Profile
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" href="{% url 'rooms:chatgroup' %}">
              <i class="bi bi-chat-dots me-1"></i> Rooms
            </a>
          </li>
          <li class="nav-item">
            <form method="post" action="{% url 'core:logout' %}">{% csrf_token %}
              <button type="submit" class="nav-link btn d-flex align-items-center">
                <i class="bi bi-box-arrow-right me-1"></i> Log out
              </button>
            </form>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    {% block content %}
    {% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  
  <script>
    // Add scrolled class to navbar on scroll
    window.addEventListener('scroll', function() {
      const navbar = document.querySelector('.navbar');
      if (window.scrollY > 10) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });
  </script>
  
  {% block scripts %}
  {% endblock %}
</body>
</html>
